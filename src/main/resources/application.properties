spring.application.name=procurementManagement
spring.profiles.active=local
spring.datasource.url=jdbc:mysql://localhost:3306/procure
spring.datasource.username=root
spring.datasource.password=7777
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.upload.dir=D:/procurementdata

app.backup.dir=E:/supplies_backups/
app.database.name=procure
app.backup.file_name=procure_last_backup.sql